<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- ========== FAVICONS ========== -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ========== THEME COLOR (mobile) ========== -->
    <meta name="theme-color" content="#2B0071" />
    <meta name="msapplication-TileColor" content="#2B0071" />

    <!-- ========== SITE NAME (helps Google show brand name) ========== -->
    <meta name="application-name" content="The Cargo Grid" />
    <meta name="apple-mobile-web-app-title" content="The Cargo Grid" />

    <!-- ========== PRIMARY SEO – SHIPPING FIRST ========== -->
    <title>The Cargo Grid – Global Shipping, Logistics &amp; Real‑Time Package Tracking</title>
    <meta
      name="description"
      content="Ship your cargo worldwide with The Cargo Grid – instant quotes, freight, customs clearance, and real‑time tracking. Reliable international logistics from the UK to anywhere."
    />
    <meta
      name="keywords"
      content="The Cargo Grid, international shipping, logistics, freight, cargo, customs clearance, UK shipping, global delivery, package tracking, real‑time tracking, supply chain, courier, parcel delivery, ship a package, book a shipment"
    />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />
    <link rel="canonical" href="https://thecargogrid.com/" />

    <!-- ========== GEO / LOCAL SEO ========== -->
    <meta name="geo.region" content="GB" />
    <meta name="geo.placename" content="London" />
    <meta name="geo.position" content="51.5074;0.1278" />
    <meta name="ICBM" content="51.5074, 0.1278" />

    <!-- ========== OPEN GRAPH (Facebook, LinkedIn, etc.) – SHIPPING FIRST ========== -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Cargo Grid – Global Shipping, Logistics &amp; Real‑Time Tracking" />
    <meta
      property="og:description"
      content="Ship your cargo worldwide with The Cargo Grid – instant quotes, freight, customs clearance, and real‑time tracking. Reliable logistics from the UK to anywhere."
    />
    <meta property="og:url" content="https://thecargogrid.com/" />
    <meta property="og:image" content="https://thecargogrid.com/preview.png" />
    <meta property="og:image:secure_url" content="https://thecargogrid.com/preview.png" />
    <meta property="og:image:width" content="1254" />
    <meta property="og:image:height" content="1254" />
    <meta property="og:image:alt" content="The Cargo Grid – global shipping, logistics, and package tracking service" />
    <meta property="og:site_name" content="The Cargo Grid" />
    <meta property="og:locale" content="en_GB" />

    <!-- ========== TWITTER CARD – SHIPPING FIRST ========== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Cargo Grid – Global Shipping, Logistics &amp; Real‑Time Tracking" />
    <meta
      name="twitter:description"
      content="Ship your cargo worldwide with The Cargo Grid – instant quotes, freight, customs clearance, and real‑time tracking. Reliable logistics from the UK to anywhere."
    />
    <meta name="twitter:image" content="https://thecargogrid.com/preview.png" />
    <meta name="twitter:image:alt" content="The Cargo Grid – global shipping, logistics, and package tracking service" />

    <!-- ========== SEARCH ENGINE VERIFICATION ========== -->
    <meta name="google-site-verification" content="-y1S8sEsb0Hzyaj_j2MLvznf-rXj_sb6F1w0tS6Y_RE" />
    <meta name="msvalidate.01" content="YOUR_BING_VERIFICATION_CODE" />

    <!-- ========== JSON‑LD STRUCTURED DATA – SHIPPING FIRST ========== -->
    <!-- Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "The Cargo Grid",
        "alternateName": "TCG Logistics",
        "url": "https://thecargogrid.com/",
        "logo": "https://thecargogrid.com/logo.png",
        "description": "Global shipping and logistics services – freight, customs clearance, and real‑time tracking. Reliable delivery from the UK to anywhere in the world.",
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+44-800-555-0199",
          "contactType": "Customer Service",
          "availableLanguage": ["English"]
        },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "London",
          "addressCountry": "GB"
        }
      }
    </script>

    <!-- WebSite + SearchAction (for tracking existing shipments) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "url": "https://thecargogrid.com/",
        "name": "The Cargo Grid",
        "description": "Global shipping, logistics, and real‑time package tracking. Ship your cargo worldwide with ease.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://thecargogrid.com/track?tracking={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- BreadcrumbList -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Home",
            "item": "https://thecargogrid.com/"
          },
          {
            "@type": "ListItem",
            "position": 2,
            "name": "Ship a Package",
            "item": "https://thecargogrid.com/ship"
          },
          {
            "@type": "ListItem",
            "position": 3,
            "name": "Track Shipment",
            "item": "https://thecargogrid.com/track"
          },
          {
            "@type": "ListItem",
            "position": 4,
            "name": "Services",
            "item": "https://thecargogrid.com/services"
          },
          {
            "@type": "ListItem",
            "position": 5,
            "name": "Contact",
            "item": "https://thecargogrid.com/contact"
          }
        ]
      }
    </script>

    <!-- Service – shipping as primary, tracking as a feature -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Service",
        "serviceType": "Global Shipping & Logistics",
        "provider": {
          "@type": "Organization",
          "name": "The Cargo Grid"
        },
        "description": "International shipping, freight forwarding, customs clearance, and real‑time tracking for complete visibility.",
        "offers": {
          "@type": "Offer",
          "price": "0.00",
          "priceCurrency": "GBP"
        }
      }
    </script>

    <!-- ========== GOOGLE FONTS ========== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- ========== PERFORMANCE ========== -->
    <link rel="preload" as="image" href="/hero-logistics.jpg" />
    <link rel="preload" as="image" href="/logo.png" />

    <!-- ========== SITEMAP ========== -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
