<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- ========== FAVICONS ========== -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ========== THEME COLOR ========== -->
    <meta name="theme-color" content="#2B0071" />
    <meta name="msapplication-TileColor" content="#2B0071" />
    <meta name="application-name" content="The Cargo Grid" />
    <meta name="apple-mobile-web-app-title" content="The Cargo Grid" />

    <!-- ========== PRIMARY SEO - SHIPPING FIRST ========== -->
    <title>
      International Shipping & Freight Forwarding | The Cargo Grid - Global
      Logistics
    </title>
    <meta
      name="description"
      content="The Cargo Grid provides reliable international shipping, freight forwarding, and customs clearance. Get real-time quotes and ship your cargo worldwide. Track your package as an extra feature."
    />
    <meta
      name="keywords"
      content="International shipping, freight forwarding, cargo shipping, global logistics, UK shipping, export import, customs clearance, supply chain, freight quotes, package tracking, The Cargo Grid"
    />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />
    <link rel="canonical" href="https://thecargogrid.com/" />

    <!-- ========== GEO / LOCAL SEO ========== -->
    <meta name="geo.region" content="GB" />
    <meta name="geo.placename" content="London" />
    <meta name="geo.position" content="51.5074;0.1278" />
    <meta name="ICBM" content="51.5074, 0.1278" />

    <!-- ========== OPEN GRAPH ========== -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="International Shipping & Freight Forwarding | The Cargo Grid"
    />
    <meta
      property="og:description"
      content="Global shipping and freight forwarding services. Get instant quotes, customs clearance, and real-time visibility. Tracking included for every shipment."
    />
    <meta property="og:url" content="https://thecargogrid.com/" />
    <meta property="og:image" content="https://thecargogrid.com/preview.png" />
    <meta
      property="og:image:secure_url"
      content="https://thecargogrid.com/preview.png"
    />
    <meta property="og:image:width" content="1254" />
    <meta property="og:image:height" content="1254" />
    <meta
      property="og:image:alt"
      content="The Cargo Grid - International shipping and freight forwarding experts."
    />
    <meta property="og:site_name" content="The Cargo Grid" />
    <meta property="og:locale" content="en_GB" />

    <!-- ========== TWITTER CARD ========== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="International Shipping & Freight Forwarding | The Cargo Grid"
    />
    <meta
      name="twitter:description"
      content="Reliable global shipping and logistics. Get a freight quote today."
    />
    <meta name="twitter:image" content="https://thecargogrid.com/preview.png" />
    <meta
      name="twitter:image:alt"
      content="The Cargo Grid - Shipping & Logistics"
    />

    <!-- ========== SEARCH ENGINE VERIFICATION ========== -->
    <meta
      name="google-site-verification"
      content="-y1S8sEsb0Hzyaj_j2MLvznf-rXj_sb6F1w0tS6Y_RE"
    />
    <meta name="msvalidate.01" content="YOUR_BING_VERIFICATION_CODE" />

    <!-- ========== JSON-LD STRUCTURED DATA (SHIPPING HEAVY) ========== -->

    <!-- Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "The Cargo Grid",
        "alternateName": "TCG Logistics",
        "url": "https://thecargogrid.com/",
        "logo": "https://thecargogrid.com/logo.png",
        "description": "International shipping and freight forwarding company based in the UK.",
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+1 512 325 5688",
          "contactType": "Customer Service",
          "availableLanguage": ["English"]
        },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "London",
          "addressCountry": "GB"
        }
      }
    </script>

    <!-- WebSite + SearchAction (For Tracking) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "url": "https://thecargogrid.com/",
        "name": "The Cargo Grid",
        "description": "International shipping and freight forwarding.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://thecargogrid.com/track?tracking={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- BreadcrumbList (Shipping first) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Home",
            "item": "https://thecargogrid.com/"
          },
          {
            "@type": "ListItem",
            "position": 2,
            "name": "Get a Quote",
            "item": "https://thecargogrid.com/get-quote"
          },
          {
            "@type": "ListItem",
            "position": 3,
            "name": "Shipping Services",
            "item": "https://thecargogrid.com/services"
          },
          {
            "@type": "ListItem",
            "position": 4,
            "name": "Track Package",
            "item": "https://thecargogrid.com/track"
          },
          {
            "@type": "ListItem",
            "position": 5,
            "name": "Contact",
            "item": "https://thecargogrid.com/contact"
          }
        ]
      }
    </script>

    <!-- Primary Service: Shipping (with tracking as extra) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Service",
        "serviceType": "International Freight Forwarding & Shipping",
        "provider": {
          "@type": "Organization",
          "name": "The Cargo Grid"
        },
        "description": "Comprehensive international shipping solutions including air freight, sea freight, road transport, customs brokerage, and real-time tracking.",
        "offers": {
          "@type": "Offer",
          "priceSpecification": {
            "@type": "PriceSpecification",
            "price": "0.00",
            "priceCurrency": "USD"
          }
        }
      }
    </script>

    <!-- Specific Shipping Service (Product) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "The Cargo Grid - Global Shipping Service",
        "description": "Full-service international shipping. Includes pickup, packing, freight, customs clearance, and doorstep delivery. Package tracking is included as standard.",
        "brand": {
          "@type": "Brand",
          "name": "The Cargo Grid"
        },
        "offers": {
          "@type": "AggregateOffer",
          "priceCurrency": "USD",
          "lowPrice": "10.00",
          "highPrice": "5000.00",
          "offerCount": "100"
        }
      }
    </script>

    <!-- FAQ Schema (to capture "People Also Ask" snippets) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How do I ship cargo internationally?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Simply get a free quote on The Cargo Grid website, book your shipment, and we handle the rest including customs clearance and freight forwarding."
            }
          },
          {
            "@type": "Question",
            "name": "Do you provide package tracking?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Although tracking is a secondary feature, we provide real-time updates for all shipments so you know exactly where your cargo is."
            }
          }
        ]
      }
    </script>

    <!-- ========== GOOGLE FONTS ========== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- ========== PERFORMANCE ========== -->
    <link rel="preload" as="image" href="/hero-logistics.jpg" />
    <link rel="preload" as="image" href="/logo.png" />

    <!-- ========== SITEMAP ========== -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
